name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        include:
          # Check the declared minimum and the newest release on Linux only,
          # to keep the matrix small.
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: python -m pyflakes gamesync/ tests/

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

  build-check:
    name: Packaging smoke test (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfuse2

      - name: Install
        run: pip install -e ".[build]"

      - name: Build AppImage
        run: ./packaging/build-appimage.sh

      - name: Verify it starts
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APPIMAGE=$(ls dist/*.AppImage)
          timeout 40 "$APPIMAGE" &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then
            echo "AppImage started successfully"
            kill $PID
          else
            wait $PID; echo "AppImage exited early with code $?"; exit 1
          fi
