name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs are the dry-run path: every platform builds and uploads its
  # artifact, but the publish job is gated on a v* tag and so is skipped.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (AppImage)
    # Built on the oldest supported glibc, an AppImage built on a newer distro
    # will refuse to start on older ones.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 libfuse2

      - name: Install
        run: pip install -e ".[build]"

      - name: Build AppImage
        run: ./packaging/build-appimage.sh

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APPIMAGE=$(ls dist/*.AppImage)
          timeout 40 "$APPIMAGE" &
          PID=$!
          sleep 15
          kill -0 $PID || { wait $PID; exit 1; }
          kill $PID

      - uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[build]"

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/gamesave-sync.spec

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path gamesync/__init__.py -Pattern 'VERSION = "(.+)"').Matches.Groups[1].Value
          Compress-Archive -Path "dist/GameSave Sync/*" -DestinationPath "dist/GameSave-Sync-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-build
          path: dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: arm64
          # macos-13 was retired and macos-14 is deprecated; macos-15-intel is
          # GitHub's current label for an Intel macOS image.
          - runner: macos-15-intel    # Intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[build]"

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/gamesave-sync.spec

      - name: Package
        run: |
          VERSION=$(python -c 'import gamesync; print(gamesync.VERSION)')
          cd dist
          # ditto preserves the bundle structure and resource forks that a
          # plain zip would mangle.
          ditto -c -k --sequesterRsrc --keepParent \
            "GameSave Sync.app" "GameSave-Sync-$VERSION-macos-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-build-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
          body: |
            ## Install

            | Platform | File |
            |---|---|
            | Linux | `*.AppImage`, `chmod +x` then run |
            | Windows | `*-windows-x64.zip`, unzip and run `GameSave Sync.exe` |
            | macOS | `*-macos-*.zip`, unzip and drag to Applications |

            > Builds are **not code-signed**. On macOS, right-click → Open on
            > first launch, or run
            > `xattr -dr com.apple.quarantine "/Applications/GameSave Sync.app"`.
            > On Windows, SmartScreen may warn on first run.

            ---
