name: Bug report
description: Something isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **redact any tokens** from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a game pointing at ...
        2. Click Back up now
        3. See error
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: os-detail
    attributes:
      label: OS version / distro
      placeholder: "Windows 11 23H2, macOS 14.4, Ubuntu 24.04, CachyOS ..."
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - AppImage (Linux)
        - Windows build from releases
        - macOS build from releases
        - From source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the bottom of the Settings tab.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: activity
    attributes:
      label: Activity log
      description: Text from the Activity tab. This is usually the most useful part.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I have removed any tokens or personal paths I don't want public
          required: true
